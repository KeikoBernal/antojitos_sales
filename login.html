<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antojito's Cakes — Acceso al módulo de ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Bodoni+Moda:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/angel-club" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .login-wrap { width:100%; max-width:400px; }
  .login-brand { text-align:center; margin-bottom:24px; }
  .login-brand img { width:80px; height:80px; object-fit:contain; filter:drop-shadow(0 6px 20px rgba(233,30,140,0.35)); margin-bottom:8px; }
  .login-brand-title { font-family:'Angel Club',sans-serif; font-size:28px; color:var(--dark); }
  .login-brand-sub { font-size:11px; color:var(--gray); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
  .login-hint { font-size:11.5px; color:var(--gray); text-align:center; margin-top:16px; line-height:1.6; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <img src="imagenes/logo.png" alt="Antojito's Cakes">
    <div class="login-brand-title">Módulo de Ventas</div>
    <div class="login-brand-sub">Antojito's Cakes · Puerto Ordaz</div>
  </div>

  <form class="form-card" id="loginForm">
    <div class="form-error" id="loginError">Usuario o contraseña incorrectos.</div>
    <div class="form-row">
      <label for="username">Usuario</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="form-row">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-primary">Ingresar</button>
  </form>

  <p class="login-hint">Usuarios de prueba: <b>admin</b> / <b>cajero</b><br>Contraseña: <code>[usuario]123</code></p>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
